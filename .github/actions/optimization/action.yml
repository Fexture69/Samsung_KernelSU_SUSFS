name: add kernel optimizations
description: Apply genuine, safe, and beneficial kernel optimizations for Samsung and Android GKI devices

runs:
 using: composite
 steps:
  - name: apply optimizations
    shell: bash
    run: |
     cd "$COMMON"
     MIN_VERSION="5.16"

     echo "=========================================================="
     echo "Applying Genuine Kernel Optimizations (S926B & Samsung GKI)"
     echo "=========================================================="

     # -------------------------------------------------------------------------
     # 1. ARM64 Memory Operations: Optimized NEON memcmp (ARM Limited / Upstream)
     # -------------------------------------------------------------------------
     if [[ $BRANCH == SM-A546* || $BRANCH == SM-S926* || $BRANCH == SM-A556* || $BRANCH == SM-M146B* || $BRANCH == SM-S908B* || $BRANCH == SM-A356* || $BRANCH == SM-S711* ]]; then
       echo "-> Applying ARM NEON optimized memcmp for Exynos"
       if [ "$(printf '%s\n' "$KERNEL_VER" "$MIN_VERSION" | sort -V | tail -n1)" = "$KERNEL_VER" ]; then
         patch -p1 < "$KERNEL_PATCHES/common/Samsung/optimise_memcmp_exynos.patch"
       elif [ "$(printf '%s\n' "$KERNEL_VER" "5.11" | sort -V | tail -n1)" = "$KERNEL_VER" ]; then
         sed -e 's/SYM_FUNC_START(__pi_memcmp)/SYM_FUNC_START_WEAK_PI(memcmp)/' -e 's/SYM_FUNC_END(__pi_memcmp)/SYM_FUNC_END_PI(memcmp)/' -e 's/SYM_FUNC_ALIAS_WEAK(memcmp, __pi_memcmp)/EXPORT_SYMBOL_NOKASAN(memcmp)/' "$KERNEL_PATCHES/common/Samsung/optimise_memcmp_exynos.patch" | patch -p1
       else
         patch -p1 < "$KERNEL_PATCHES/common/Samsung/optimise_noneon_memcmp_android12_5.10.patch"
       fi
     else
       echo "-> Applying ARM NEON optimized memcmp"
       if [ "$(printf '%s\n' "$KERNEL_VER" "$MIN_VERSION" | sort -V | tail -n1)" = "$KERNEL_VER" ]; then
         patch -p1 < "$KERNEL_PATCHES/common/optimise_memcmp.patch"
       elif [ "$(printf '%s\n' "$KERNEL_VER" "5.11" | sort -V | tail -n1)" = "$KERNEL_VER" ]; then
         sed -e 's/SYM_FUNC_START(__pi_memcmp)/SYM_FUNC_START_WEAK_PI(memcmp)/' -e 's/SYM_FUNC_END(__pi_memcmp)/SYM_FUNC_END_PI(memcmp)/' -e 's/SYM_FUNC_ALIAS_WEAK(memcmp, __pi_memcmp)/EXPORT_SYMBOL_NOKASAN(memcmp)/' "$KERNEL_PATCHES/common/optimise_memcmp.patch" | patch -p1
       else
         patch -p1 < "$KERNEL_PATCHES/common/Samsung/optimise_noneon_memcmp_android12_5.10.patch"
       fi
     fi

     # -------------------------------------------------------------------------
     # 2. ARM64 Page Clearing: 16-byte alignment for clear_page (Sultan Alsawaf)
     # Cuts CPU cycles during page zeroing/allocation
     # -------------------------------------------------------------------------
     echo "-> Applying clear_page 16-byte alignment"
     if [ -f "$KERNEL_PATCHES/common/Samsung/clear_page_16bytes_align_kernel6.1.patch" ] && [ "$KERNEL_VER" = "6.1" ]; then
       patch -p1 < "$KERNEL_PATCHES/common/Samsung/clear_page_16bytes_align_kernel6.1.patch"
     elif [ "$(printf '%s\n' "$KERNEL_VER" "$MIN_VERSION" | sort -V | head -n1)" = "$KERNEL_VER" ]; then
       patch -p1 < "$KERNEL_PATCHES/common/clear_page_16bytes_align.patch"
     else
       sed -e 's/SYM_FUNC_START_PI(clear_page)/SYM_FUNC_START(__pi_clear_page)/' "$KERNEL_PATCHES/common/clear_page_16bytes_align.patch" | patch -p1
     fi

     # -------------------------------------------------------------------------
     # 3. F2FS Storage: Reduce congestion timeout (Danny Lin / Park Ju Hyung)
     # Lowers wait timeout from 20ms to 6ms, preventing UI micro-stutters
     # -------------------------------------------------------------------------
     echo "-> Applying F2FS congestion timeout reduction"
     patch -p1 < "$KERNEL_PATCHES/common/f2fs_reduce_congestion.patch"

     # -------------------------------------------------------------------------
     # 4. F2FS Storage: Enlarge min fsync blocks to 20 (OEM Production Tweak)
     # Reduces small fsync write amplification on flash memory
     # -------------------------------------------------------------------------
     echo "-> Applying F2FS enlarge min fsync blocks"
     patch -p1 < "$KERNEL_PATCHES/common/f2fs_enlarge_min_fsync_blocks.patch"

     # -------------------------------------------------------------------------
     # 5. Power Management: Reduce freeze timeout to 1s (Sultan Alsawaf)
     # Prevents burning power waiting for deadlocked tasks during suspend
     # -------------------------------------------------------------------------
     echo "-> Applying PM freeze timeout reduction"
     patch -p1 < "$KERNEL_PATCHES/common/reduce_freeze_timeout.patch"

     # -------------------------------------------------------------------------
     # 6. Power Management: Avoid redundant s2idle wakeups (Sultan Alsawaf)
     # Cleans up unnecessary wake cycles when suspend aborts
     # -------------------------------------------------------------------------
     echo "-> Applying avoid excessive s2idle wake attempts"
     if [[ "$BRANCH" == "SM-S928B-Oneui8.5" || "$BRANCH" == "SM-S926B-Oneui8.5" || "$BRANCH" == "SM-S938B-Oneui8.5" || "$BRANCH" == "SM-S931B-Oneui8.5" ]]; then
       patch -p1 < "$KERNEL_PATCHES/common/Samsung/avoid_extra_s2idle_wake_attempts_oneui8.5.patch"
     else
       patch -p1 < "$KERNEL_PATCHES/common/avoid_extra_s2idle_wake_attempts.patch"
     fi

     # -------------------------------------------------------------------------
     # 7. CPU Scheduler: Adjust idle scan order (ByteDance / Mainline Linux)
     # Skips scanning the already-evaluated target CPU in select_idle_capacity()
     # -------------------------------------------------------------------------
     echo "-> Applying adjust CPU idle scan order"
     patch -p1 < "$KERNEL_PATCHES/common/adjust_cpu_scan_order.patch"

     # -------------------------------------------------------------------------
     # 8. Sched Features: Disable CACHE_HOT_BUDDY for non-Exynos platforms
     # (Kept disabled on S926B / Exynos where custom topology handles affinity)
     # -------------------------------------------------------------------------
     if [[ $BRANCH != SM-S926* && $BRANCH != SM-A546* && $BRANCH != SM-A356* && $BRANCH != SM-S711* ]]; then
       echo "-> Applying disable CACHE_HOT_BUDDY (DynamIQ DSU)"
       patch -p1 < "$KERNEL_PATCHES/common/disable_cache_hot_buddy.patch"
     else
       echo "-> Skipping disable_cache_hot_buddy for S24+/Exynos topology"
     fi

     echo "=========================================================="
     echo "Genuine optimizations successfully applied!"
     echo "Excluded dangerous tweaks: add_timeout_wakelocks (breaks audio/sync),"
     echo "alarmtimer clamp (delays alarms), file_struct 8-byte align (ABI risk),"
     echo "scaling_min_freq limits (DVFS clash), and printk log silencers."
     echo "=========================================================="
