name: Disable Samsung Protection
description: Disable Samsung Knox and security protections
inputs:
  disable_security:
    description: Toggle disabling Samsung security configs
    required: false
    default: 'true'
  ksu_lkm:
    description: "Build KernelSU as Samsung LKM with KDP/RKP/DEFEX shims"
    required: false
    default: 'false'

runs:
 using: composite
 steps:
  - name: Disable Samsung Protection
    if: inputs.disable_security == 'true' && inputs.ksu_lkm != 'true'
    shell: bash
    run: |
     # 1. Determine which defconfig file needs to be patched based on the branch
     target_config=""
     
     if [[ $BRANCH == SM-S938B* || "$BRANCH" == "SM-S931B-Oneui8" ]]; then
         echo "Nothing to see here, moving on..."
     elif [[ $BRANCH == SM-S926B* ]]; then
         target_config="$COMMON/arch/arm64/configs/s5e9945-bazel_defconfig"
     elif [[ $BRANCH == SM-A556* ]]; then
         target_config="$COMMON/arch/arm64/configs/s5e8845-bazel_defconfig"
     elif [[ $BRANCH == SM-A055* || $BRANCH == SM-A146P* ]]; then
         target_config="$CONFIG/kernel/kernel_device_modules-6.6/arch/arm64/configs/mediatek-bazel_defconfig"
     elif [[ $BRANCH == SM-A075* ]]; then
         target_config="$COMMON/arch/arm64/configs/a07_00_defconfig"
     else
         target_config="$GKI_DEFCONFIG"
     fi
     
     # 2. Apply the nuke modifications exactly once if a target file was assigned
     if [ -n "$target_config" ]; then
      echo "Nuking Samsung Knox/Root protection in: $target_config"

      # Disable Samsung Protection
      "$COMMON/scripts/config" --file "$target_config" \
          -d UH -d RKP -d KDP -d SECURITY_DEFEX -d INTEGRITY -d FIVE \
          -d TRIM_UNUSED_KSYMS -d PROCA -d PROCA_GKI_10 -d PROCA_S_OS \
          -d PROCA_CERTIFICATES_XATTR -d PROCA_CERT_ENG -d PROCA_CERT_USER \
          -d GAF -d GAF_V6 -d FIVE_CERT_USER -d FIVE_DEFAULT_HASH \
          -e CONFIG_TMPFS_XATTR -e CONFIG_TMPFS_POSIX_ACL
     fi

  - name: Configure Samsung KDP/RKP/DEFEX Shims for LKM Mode
    if: inputs.ksu_lkm == 'true'
    shell: bash
    run: |
     # 1. Determine which defconfig file needs to be patched based on the branch
     target_config=""
     
     if [[ $BRANCH == SM-S938B* || "$BRANCH" == "SM-S931B-Oneui8" ]]; then
         echo "Nothing to see here, moving on..."
     elif [[ $BRANCH == SM-S926B* ]]; then
         target_config="$COMMON/arch/arm64/configs/s5e9945-bazel_defconfig"
     elif [[ $BRANCH == SM-A556* ]]; then
         target_config="$COMMON/arch/arm64/configs/s5e8845-bazel_defconfig"
     elif [[ $BRANCH == SM-A055* || $BRANCH == SM-A146P* ]]; then
         target_config="$CONFIG/kernel/kernel_device_modules-6.6/arch/arm64/configs/mediatek-bazel_defconfig"
     elif [[ $BRANCH == SM-A075* ]]; then
         target_config="$COMMON/arch/arm64/configs/a07_00_defconfig"
     else
         target_config="$GKI_DEFCONFIG"
     fi
     
     configs=("$GKI_DEFCONFIG")
     if [ -n "$target_config" ] && [ "$target_config" != "$GKI_DEFCONFIG" ]; then
         configs+=("$target_config")
     fi

     for cfg in "${configs[@]}"; do
       if [ -f "$cfg" ]; then
         echo "Configuring Samsung KDP/RKP/DEFEX LKM in: $cfg"

         # Configure KernelSU as loadable module (.ko) and required hooking infrastructure
         "$COMMON/scripts/config" --file "$cfg" \
           -m KSU \
           -e KPROBES \
           -e HAVE_KPROBES \
           -e KRETPROBES \
           -e KSU_SAMSUNG_KDP \
           -e KSU_SAMSUNG_RKP \
           -e KSU_SAMSUNG_DEFEX \
           -e KSU_SAMSUNG_NO_PATCH_TEXT \
           -e UH \
           -e RKP \
           -e KDP \
           -e KDP_CRED \
           -e SECURITY_DEFEX \
           -e MODULES \
           -e MODULE_UNLOAD \
           -d MODVERSIONS \
           -d MODULE_SIG \
           -d MODULE_SIG_FORCE \
           -d MODULE_SIG_ALL \
           -d TRIM_UNUSED_KSYMS \
           -e CONFIG_TMPFS_XATTR \
           -e CONFIG_TMPFS_POSIX_ACL

         # Ensure explicit symbols in defconfig
         for sym in CONFIG_KSU=m CONFIG_KPROBES=y CONFIG_HAVE_KPROBES=y CONFIG_KRETPROBES=y \
                    CONFIG_KSU_SAMSUNG_KDP=y CONFIG_KSU_SAMSUNG_RKP=y CONFIG_KSU_SAMSUNG_DEFEX=y \
                    CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT=y CONFIG_UH=y CONFIG_RKP=y CONFIG_KDP=y \
                    CONFIG_KDP_CRED=y CONFIG_SECURITY_DEFEX=y CONFIG_MODULES=y CONFIG_MODULE_UNLOAD=y; do
           sed -i "/^${sym%%=*}=/d" "$cfg"
           echo "$sym" >> "$cfg"
         done
         for dsym in CONFIG_MODVERSIONS CONFIG_MODULE_SIG CONFIG_MODULE_SIG_FORCE CONFIG_MODULE_SIG_ALL CONFIG_TRIM_UNUSED_KSYMS; do
           sed -i "/^${dsym}=/d" "$cfg"
           echo "# ${dsym} is not set" >> "$cfg"
         done
       fi
     done

  - name: remove check_defconfig
    shell: bash
    run: |
     cd "$COMMON"
     # Remove check_defconfig
     if [ -f ./build.config.gki ]; then
       sed -i 's/check_defconfig//' ./build.config.gki
     fi
