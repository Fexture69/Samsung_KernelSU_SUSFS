name: Set up KernelSU-Next
description: download and set up KSUN into the kernel source
inputs:
 susfs:
  description: 'susfs'
  required: true
 ksu_lkm:
  description: 'Build KernelSU as Samsung LKM'
  required: false
  default: 'false'


runs:
  using: composite
  steps:
    - name: Setup KSUN with no susfs
      if: inputs.susfs == 'false' && inputs.ksu_lkm != 'true'
      shell: bash
      run: |
        cd "$COMMON"
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s dev

    - name: Setup pershoot KSUN with susfs
      if: inputs.susfs == 'true' && inputs.ksu_lkm != 'true'
      shell: bash
      run: |
        cd "$COMMON"
        curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs

    - name: Setup KernelSU-Next (Samsung LKM Shim Branch)
      if: inputs.ksu_lkm == 'true'
      shell: bash
      run: |
        cd "$COMMON"
        rm -rf KernelSU-Next drivers/kernelsu
        git clone -b samsung-lateload https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
        cd drivers
        ln -sf ../KernelSU-Next/kernel kernelsu
        grep -q "kernelsu" Makefile || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> Makefile
        grep -q "drivers/kernelsu/Kconfig" Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' Kconfig

    - name: enable in defconfig
      if: inputs.ksu_lkm != 'true'
      shell: bash
      run: |
         "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_KSU

         if [[ ${{ inputs.susfs }} == 'true' ]]; then
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_KSU_SAMSUNG_KDP
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_KSU_SAMSUNG_RKP
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_KSU_SAMSUNG_DEFEX
          "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT
         fi
      
    - name: Extract KSU Version Info and inject into Kbuild
      shell: bash
      run: |
        cd "$COMMON/KernelSU-Next"

        # Fetch branch for version info (tags, commits, etc.)
        if [[ "${{ inputs.ksu_lkm }}" == "true" ]]; then
          git fetch origin samsung-lateload 2>/dev/null || true
          REF="refs/remotes/origin/samsung-lateload"
        else
          git fetch origin dev 2>/dev/null || true
          REF="refs/remotes/origin/dev"
        fi
        
        # Extract and export KSU version info
        KSU_GIT_VERSION=$(git rev-list --count "$REF" 2>/dev/null || git rev-list --count HEAD 2>/dev/null || echo 0)
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 "$REF" 2>/dev/null || git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
        KSU_COMMIT=$(git rev-parse --short "$REF" 2>/dev/null || git rev-parse --short HEAD 2>/dev/null || echo "")
        KSU_VERSION=$((30000 + KSU_GIT_VERSION))

        cd kernel
        sed -i "s/^KSU_VERSION_FALLBACK := 1$/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" Kbuild || true
        sed -i "s/^KSU_VERSION_TAG_FALLBACK := v0.0.1$/KSU_VERSION_TAG_FALLBACK := ${KSU_GIT_TAG}/" Kbuild || true
        
        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> $GITHUB_ENV
        echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
        echo "KSU_COMMIT=$KSU_COMMIT" >> $GITHUB_ENV

