name: get kernel version before cloning
description: get kernel version before cloning

runs:
  using: composite
  steps:
    - name: Locate and extract kernel version
      shell: bash
      run: |
        REPO="WildKernels/Samsung_Kernels"

        echo "Searching for kernel Makefile on branch $BRANCH"

        TREE_URL="https://api.github.com/repos/$REPO/git/trees/$BRANCH?recursive=1"

        # Download tree once
        TREE_JSON=$(curl -s "$TREE_URL")

        if [ -z "$TREE_JSON" ]; then
          echo "::error::Failed to download repository tree"
          exit 1
        fi

        # Extract all Makefiles
        echo "$TREE_JSON" | jq -r '.tree[].path' > files.txt

        MAKEFILE_PATH=""

        while read -r file; do
          case "$file" in
            *Makefile)
              echo "Checking: $file"

              CONTENT=$(curl -s "https://raw.githubusercontent.com/$REPO/$BRANCH/$file")

              if echo "$CONTENT" | grep -qE '^VERSION[[:space:]]*='; then
                MAKEFILE_PATH="$file"
                break
              fi
              ;;
          esac
        done < files.txt

        if [ -z "$MAKEFILE_PATH" ]; then
          echo "::error::Could not find kernel Makefile"
          exit 1
        fi

        echo "Found kernel Makefile: $MAKEFILE_PATH"

        RAW_URL="https://raw.githubusercontent.com/$REPO/$BRANCH/$MAKEFILE_PATH"

        MAKEFILE_CONTENT=$(curl -s "$RAW_URL")

        VERSION=$(echo "$MAKEFILE_CONTENT" | grep -m1 -E '^VERSION[[:space:]]*=' | awk '{print $3}')
        PATCHLEVEL=$(echo "$MAKEFILE_CONTENT" | grep -m1 -E '^PATCHLEVEL[[:space:]]*=' | awk '{print $3}')

        if [ -z "$VERSION" ] || [ -z "$PATCHLEVEL" ]; then
          echo "::error::Could not extract kernel version"
          exit 1
        fi

        KERNEL_VERSION="$VERSION.$PATCHLEVEL"

        case "$KERNEL_VERSION" in
          5.10)
            ANDROID_VERSION="android12"
            ;;
          5.15)
            ANDROID_VERSION="android13"
            ;;
          6.1)
            ANDROID_VERSION="android14"
            ;;
          6.6)
            ANDROID_VERSION="android15"
            ;;
          *)
            ANDROID_VERSION="unknown"
            ;;
        esac

        echo "Android: $ANDROID_VERSION"
        echo "Kernel: $KERNEL_VERSION"

        echo "ANDROID_VERSION=$ANDROID_VERSION" >> "$GITHUB_ENV"
        echo "KERNEL_VERSION=$KERNEL_VERSION" >> "$GITHUB_ENV"
